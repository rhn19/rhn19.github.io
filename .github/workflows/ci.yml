name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Validate HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Check links
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const links = [...html.matchAll(/(?:href|src)=\"([^\"]+)\"/g)].map(m => m[1]);
            const local = links.filter(l => !l.startsWith('http') && !l.startsWith('mailto:') && !l.startsWith('#'));
            let broken = false;
            for (const l of local) {
              if (!fs.existsSync(l)) {
                console.error('Broken local link:', l);
                broken = true;
              }
            }
            if (broken) process.exit(1);
            console.log('All', local.length, 'local links valid');
          "

  performance:
    name: Performance & Accessibility
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npx serve -l 3000 &

      - name: Wait for server
        run: sleep 3

      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:3000
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true

      - name: Accessibility audit (pa11y)
        run: npx pa11y http://localhost:3000 --standard WCAG2AA --config .pa11y.json
